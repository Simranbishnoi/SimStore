version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: reading_room_db
    restart: always
    environment:
      POSTGRES_USER: bookstore
      POSTGRES_PASSWORD: password123
      POSTGRES_DB: bookstore
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data: